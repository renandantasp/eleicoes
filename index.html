<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Comparacao das votacoes do 1o e do 2o turno da eleicao presidencial de 2026 por bairro de Araraquara/SP, com dados oficiais do TSE."
    />
    <title>Araraquara em dois turnos — 2026</title>
    <script>
      // Define o tema antes do primeiro render, para a pagina nao piscar.
      (function () {
        try {
          var salvo = localStorage.getItem("ag-theme");
          var sistema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = salvo || sistema;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
