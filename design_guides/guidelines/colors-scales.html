<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--ag-font-sans);font-variant-numeric:tabular-nums}.duo{display:grid;grid-template-columns:1fr 1fr}.pane{padding:16px 18px;background:var(--ag-bg);color:var(--ag-text-1)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.k{font:400 10.5px var(--ag-font-mono);color:var(--ag-text-helper)}</style></head><body><div class="pane ag-root" style="display:flex;flex-direction:column;gap:4px"><div style="display:grid;grid-template-columns:60px repeat(5,1fr);gap:2px;align-items:center"><span class="k">red</span><div style="height:22px;background:var(--ag-red-1)"></div><div style="height:22px;background:var(--ag-red-2)"></div><div style="height:22px;background:var(--ag-red-3)"></div><div style="height:22px;background:var(--ag-red-4)"></div><div style="height:22px;background:var(--ag-red-5)"></div></div><div style="display:grid;grid-template-columns:60px repeat(5,1fr);gap:2px;align-items:center"><span class="k">blue</span><div style="height:22px;background:var(--ag-blue-1)"></div><div style="height:22px;background:var(--ag-blue-2)"></div><div style="height:22px;background:var(--ag-blue-3)"></div><div style="height:22px;background:var(--ag-blue-4)"></div><div style="height:22px;background:var(--ag-blue-5)"></div></div><div style="display:grid;grid-template-columns:60px repeat(5,1fr);gap:2px;align-items:center"><span class="k">green</span><div style="height:22px;background:var(--ag-green-1)"></div><div style="height:22px;background:var(--ag-green-2)"></div><div style="height:22px;background:var(--ag-green-3)"></div><div style="height:22px;background:var(--ag-green-4)"></div><div style="height:22px;background:var(--ag-green-5)"></div></div><div style="display:grid;grid-template-columns:60px repeat(5,1fr);gap:2px;align-items:center"><span class="k">amber</span><div style="height:22px;background:var(--ag-amber-1)"></div><div style="height:22px;background:var(--ag-amber-2)"></div><div style="height:22px;background:var(--ag-amber-3)"></div><div style="height:22px;background:var(--ag-amber-4)"></div><div style="height:22px;background:var(--ag-amber-5)"></div></div><div style="display:grid;grid-template-columns:60px repeat(5,1fr);gap:2px;align-items:center"><span class="k">teal</span><div style="height:22px;background:var(--ag-teal-1)"></div><div style="height:22px;background:var(--ag-teal-2)"></div><div style="height:22px;background:var(--ag-teal-3)"></div><div style="height:22px;background:var(--ag-teal-4)"></div><div style="height:22px;background:var(--ag-teal-5)"></div></div><span class="k" style="margin-top:6px">red/blue = só métricas que opõem as chapas · green = abstenção, brancos e nulos · amber↔teal = comparecimento (sem lado)</span></div></body></html>
